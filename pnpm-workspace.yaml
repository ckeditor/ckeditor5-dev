packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  'esbuild': true
  'puppeteer': true
  'snyk': true

overrides:
  '@puppeteer/browsers@^2': '^3.0.6'
  'diff@^7': '^8.0.3'
  'esbuild@^0.27': '^0.28.1'
  'js-yaml@^3': '^4.3.1'
  'lodash@^4': '^4.18.1'
  'minimatch@^9': '^9.0.7'
  'postcss-selector-parser@^6': '^7.1.6'
  # `raw-loader` still asks for the 3.x line, which pulls `ajv@6` together with its old URI parser.
  # The 4.x line moves to `ajv@8`, which relies on `fast-uri` instead.
  'schema-utils@^3': '^4.5.0'
  'serialize-javascript@^6': '^7.1.2'
  'uuid@^8': '^14.0.0'
  'ws@^8': '^8.21.1'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'
  - 'fast-uri' # Remove after 2026-10-22.

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
autoDedupe: true
linkWorkspacePackages: true
# `ckeditor5-dev-utils` and `ckeditor5-dev-translations` depend on each other. pnpm fails
# the whole run on a task cycle instead of scheduling it in topological chunks. In that pair
# only `ckeditor5-dev-utils` has a `build` script and `ckeditor5-dev-translations` ships a committed
# `lib/`, so the order the two run in relative to each other makes no difference.
ignoreWorkspaceCycles: true
verifyDepsBeforeRun: false
