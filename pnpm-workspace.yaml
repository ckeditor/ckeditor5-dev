packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  'esbuild': true
  'puppeteer': true
  'snyk': true

overrides:
  '@puppeteer/browsers@^2': '^3.0.6'
  'brace-expansion@^1': '^1.1.18'
  'brace-expansion@^2': '^2.1.4'
  'brace-expansion@^5': '^5.0.9'
  'browserslist@^4': '^4.28.7'
  'diff@^7': '^8.0.3'
  'esbuild@^0.27': '^0.28.1'
  'fast-uri@^3': '^3.1.6'
  'js-yaml@^3': '^4.3.1'
  'js-yaml@^4': '^4.3.1'
  'lodash@^4': '^4.18.1'
  'minimatch@^9': '^9.0.7'
  'nanoid@^3': '^3.3.18'
  # `raw-loader` still asks for the 3.x line, which pulls `ajv@6` together with its old URI parser.
  # The 4.x line moves to `ajv@8`, which relies on `fast-uri` instead.
  'schema-utils@^3': '^4.5.0'
  'serialize-javascript@^6': '^7.0.5'
  'socket.io-parser@^4': '^4.2.7'
  'uuid@^8': '^14.0.0'
  'ws@^8': '^8.21.1'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
linkWorkspacePackages: true
verifyDepsBeforeRun: false
